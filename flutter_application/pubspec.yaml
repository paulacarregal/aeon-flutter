name: flutter_application
description: "AEON - Guia urbano inteligente"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  carousel_slider: ^5.0.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.0.0
  firebase_ai: ^3.14.1

  # State management
  provider: ^6.1.2

  # Local notifications
  flutter_local_notifications: ^19.4.0

  # Networking
  http: ^1.4.0

  # Map (cross-platform: Android, iOS, Web, Desktop)
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # Location
  geolocator: ^14.0.0

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Utils
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.0
  firebase_app_check: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/places/
