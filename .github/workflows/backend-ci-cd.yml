name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "aeon-backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "aeon-backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/aeon-backend

permissions:
  contents: read

jobs:
  test-and-build:
    name: Testes, cobertura e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aeon-backend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: aeon-backend/pom.xml

      - name: Executar testes e gerar pacote
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Publicar relatorios de testes e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_number }}
          path: |
            aeon-backend/target/surefire-reports/
            aeon-backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar JAR do backend
        uses: actions/upload-artifact@v4
        with:
          name: aeon-backend-${{ github.sha }}
          path: aeon-backend/target/aeon-backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14

      - name: Resumo da integracao continua
        if: always()
        run: |
          {
            echo "## AEON Backend"
            echo "- Build Maven e testes automatizados executados"
            echo "- Relatorios JUnit: target/surefire-reports"
            echo "- Cobertura JaCoCo: target/site/jacoco/index.html"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Revisao de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar novas dependencias vulneraveis
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  publish-container:
    name: Publicar imagem no GHCR
    if: github.event_name != 'pull_request'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Construir e publicar imagem
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: aeon-backend
          file: aeon-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Registrar entrega
        run: |
          {
            echo "## Imagem publicada"
            echo "- Registry: ${{ env.REGISTRY }}"
            echo "- Imagem: ${{ env.IMAGE_NAME }}"
            echo "- Digest: ${{ steps.docker.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-oracle:
    name: Atualizar Oracle
    if: github.event_name != 'pull_request'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: oracle
    env:
      ORACLE_TNS_ALIAS: ${{ secrets.ORACLE_TNS_ALIAS }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
      ORACLE_WALLET_BASE64: ${{ secrets.ORACLE_WALLET_BASE64 }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar configuracao do Oracle
        id: oracle-config
        shell: bash
        run: |
          if [[ -n "$ORACLE_TNS_ALIAS" \
             && -n "$ORACLE_USER" \
             && -n "$ORACLE_PASSWORD" \
             && -n "$ORACLE_WALLET_BASE64" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deploy Oracle ignorado: configure os Secrets do environment oracle." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configurar Java 21
        if: steps.oracle-config.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Instalar Oracle SQLcl
        if: steps.oracle-config.outputs.configured == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip \
            --output sqlcl.zip
          unzip -q sqlcl.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sqlcl/bin" >> "$GITHUB_PATH"

      - name: Configurar wallet mTLS
        if: steps.oracle-config.outputs.configured == 'true'
        shell: bash
        run: |
          WALLET_DIR="$RUNNER_TEMP/oracle-wallet"
          mkdir -p "$WALLET_DIR"
          printf '%s' "$ORACLE_WALLET_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-wallet.zip"
          unzip -q "$RUNNER_TEMP/oracle-wallet.zip" -d "$WALLET_DIR"
          chmod 600 "$WALLET_DIR"/*
          echo "TNS_ADMIN=$WALLET_DIR" >> "$GITHUB_ENV"

      - name: Aplicar package, wrappers e triggers
        if: steps.oracle-config.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p aeon-backend/target/oracle
          set -o pipefail
          sql -S /nolog <<SQL | tee aeon-backend/target/oracle/deploy.log
          SET ECHO OFF
          SET FEEDBACK ON
          SET SERVEROUTPUT ON
          WHENEVER OSERROR EXIT 9 ROLLBACK
          WHENEVER SQLERROR EXIT SQL.SQLCODE ROLLBACK
          CONNECT ${ORACLE_USER}/"${ORACLE_PASSWORD}"@${ORACLE_TNS_ALIAS}
          SET ECHO ON
          @aeon-backend/database/oracle/06_devops_upgrade.sql
          @aeon-backend/database/oracle/03_functions.sql
          @aeon-backend/database/oracle/04_procedures.sql
          @aeon-backend/database/oracle/07_validacao.sql
          EXIT 0
          SQL

      - name: Publicar log do deploy Oracle
        if: always() && steps.oracle-config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-deploy-log-${{ github.run_number }}
          path: aeon-backend/target/oracle/deploy.log
          if-no-files-found: warn
          retention-days: 14
